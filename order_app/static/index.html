<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>재료 최저가</title>
  <meta name="theme-color" content="#1f7a4d">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 재료 목록 화면 -->
  <section id="list-view" class="view">
    <header class="topbar">
      <h1>재료 최저가</h1>
      <button id="menu-btn" class="icon-btn" aria-label="백업 메뉴">⋯</button>
    </header>

    <div id="mode-banner" class="banner" hidden></div>

    <div class="toolbar">
      <input id="filter" type="search" placeholder="재료 이름으로 찾기" autocomplete="off">
      <button id="add-btn" class="btn primary">+ 재료 추가</button>
    </div>

    <ul id="items" class="items"></ul>
    <p id="empty" class="empty" hidden>아직 등록된 재료가 없습니다.<br>오른쪽 위 <b>+ 재료 추가</b>로 자주 사는 재료를 올려주세요.</p>
  </section>

  <!-- 검색 결과 화면 -->
  <section id="result-view" class="view" hidden>
    <header class="topbar">
      <button id="back-btn" class="icon-btn" aria-label="뒤로">←</button>
      <div class="title-wrap">
        <h1 id="result-title"></h1>
        <p id="result-query" class="sub"></p>
      </div>
      <button id="refresh-btn" class="btn small">새로고침</button>
    </header>

    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="정렬">
        <button data-sort="price" class="on">가격순</button>
        <button data-sort="unit">단위가격순</button>
      </div>
    </div>

    <div id="best"></div>
    <ul id="results" class="results"></ul>
    <p id="result-msg" class="empty" hidden></p>

    <footer class="notes">
      <p>가격은 네이버쇼핑 기준이며 <b>배송비는 포함되지 않습니다.</b> 단위가격은 상품명에서 읽은 용량으로 계산한 추정치입니다.</p>
      <p class="links">다른 곳에서도 보기:
        <a id="ext-naver" target="_blank" rel="noopener">네이버쇼핑</a> ·
        <a id="ext-coupang" target="_blank" rel="noopener">쿠팡</a>
      </p>
    </footer>
  </section>

  <!-- 재료 추가/편집 -->
  <dialog id="item-dialog">
    <form id="item-form" method="dialog">
      <h2 id="dialog-title">재료 추가</h2>
      <label>재료 이름 *
        <input name="name" required maxlength="40" placeholder="예: 설탕">
      </label>
      <label>검색어 <span class="hint">비우면 재료 이름으로 검색</span>
        <input name="query" maxlength="100" placeholder="예: 백설 하얀설탕 15kg">
      </label>
      <label>제외할 단어 <span class="hint">쉼표로 구분</span>
        <input name="exclude" maxlength="200" placeholder="예: 스틱, 시럽, 각설탕">
      </label>
      <label>메모
        <input name="memo" maxlength="100" placeholder="예: 2주에 1포대">
      </label>
      <div class="actions">
        <button type="button" id="cancel-btn" class="btn">취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 백업 메뉴 -->
  <dialog id="menu-dialog">
    <div class="menu">
      <h2>재료 목록 백업</h2>
      <p class="hint">재료 목록은 이 휴대폰(브라우저)에만 저장됩니다. 기기를 바꿀 때는 파일로 옮기세요.</p>
      <button id="export-btn" class="btn">파일로 내보내기</button>
      <label class="btn file-btn">파일에서 가져오기<input id="import-input" type="file" accept="application/json,.json" hidden></label>
      <button id="code-btn" class="btn" hidden>접속 코드 다시 입력</button>
      <button id="menu-close" class="btn primary">닫기</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
