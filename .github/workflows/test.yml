name: Naver New-Open Bot

# 수동 실행 + (선택) 매일 자동 실행
on:
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 버튼으로 수동 실행
  # 매일 한국시간 오전 9시 자동 실행하려면 아래 2줄의 주석(#)을 제거
  # schedule:
  #   - cron: '0 0 * * *'   # UTC 00:00 = 한국시간 09:00

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30     # 30분 넘으면 강제 종료(무한 대기 방지)

    steps:
      # 1) 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2) 파이썬 설치
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3) 파이썬 패키지 설치
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright openpyxl

      # 4) Playwright 브라우저 + 시스템 의존성 설치 (이게 빠지면 무조건 실패)
      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # 5) 크롤러 실행
      - name: Run scraper
        run: python main.py

      # 6) 결과물(엑셀/요약/스크린샷) 업로드
      #    if: always() → 앞 단계가 실패해도 결과 폴더는 무조건 업로드
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-results
          path: output/
          if-no-files-found: warn
          retention-days: 14
