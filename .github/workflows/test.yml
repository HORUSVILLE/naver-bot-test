name: Naver New-Open Bot

on:
  workflow_dispatch:        # 수동 실행 버튼
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 한국시간 09:00 매일 실행

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install playwright openpyxl

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naver-results
          path: output/
          if-no-files-found: warn
          retention-days: 14

      # ============================================================
      # 결과 메일 발송 (Gmail SMTP)
      # 사용 Secrets:
      #   GMAIL_USER          - 보낼 Gmail 주소
      #   GMAIL_APP_PASSWORD  - Gmail 앱 비밀번호 16자리
      #   MAIL_TO             - 받을 메일 주소
      # ============================================================
      - name: Read summary for mail body
        if: always()
        id: read_summary
        run: |
          if [ -f output/summary.txt ]; then
            {
              echo 'body<<EOF'
              cat output/summary.txt
              echo
              echo '---'
              echo '자세한 결과는 첨부된 results.xlsx 파일을 확인하세요.'
              echo 'GitHub Actions 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              echo EOF
            } >> $GITHUB_OUTPUT
          else
            {
              echo 'body<<EOF'
              echo 'summary.txt가 생성되지 않았습니다. 실행 중 오류가 있을 수 있습니다.'
              echo 'GitHub Actions 실행: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
              echo EOF
            } >> $GITHUB_OUTPUT
          fi

      - name: Send result mail
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "[자동발송] 용인 신규오픈 수집 - ${{ github.run_started_at }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.GMAIL_USER }}
          body: ${{ steps.read_summary.outputs.body }}
          attachments: output/results.xlsx,output/summary.txt
          ignore_cert: true
