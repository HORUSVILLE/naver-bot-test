name: Playwright Screenshot

on:
  workflow_dispatch:
  schedule:
    - cron: "25 23 * * *"   # 한국시간 오전 8:25

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright openpyxl
          python -m playwright install chromium --with-deps

      - name: Run scraper
        run: |
          python main.py

      - name: Send result email
        if: always()
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from pathlib import Path
          from datetime import datetime
          from email.message import EmailMessage

          gmail_user = os.environ["GMAIL_USER"]
          gmail_password = os.environ["GMAIL_APP_PASSWORD"]

          summary_path = Path("output/summary.txt")
          excel_path = Path("output/results.xlsx")

          now = datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          if summary_path.exists():
              summary_text = summary_path.read_text(encoding="utf-8")
          else:
              summary_text = "summary.txt 파일이 생성되지 않았습니다."

          body = f"""깃허브 자동 수집 결과입니다.

          실행시각: {now}

          요약:
          {summary_text}

          첨부:
          - results.xlsx (있을 경우)
          - summary.txt (있을 경우)
          """

          msg = EmailMessage()
          msg["Subject"] = f"[자동발송] 용인 신규사업자 필터형 결과 - {now}"
          msg["From"] = gmail_user
          msg["To"] = gmail_user
          msg.set_content(body)

          if excel_path.exists():
              with open(excel_path, "rb") as f:
                  msg.add_attachment(
                      f.read(),
                      maintype="application",
                      subtype="vnd.openxmlformats-officedocument.spreadsheetml.sheet",
                      filename="results.xlsx"
                  )

          if summary_path.exists():
              with open(summary_path, "rb") as f:
                  msg.add_attachment(
                      f.read(),
                      maintype="text",
                      subtype="plain",
                      filename="summary.txt"
                  )

          with smtplib.SMTP_SSL("smtp.gmail.com", 465) as smtp:
              smtp.login(gmail_user, gmail_password)
              smtp.send_message(msg)

          print("Email sent successfully")
          PY

      - name: Upload minimal artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: output-minimal
          path: |
            output/results.xlsx
            output/summary.txt
            output/*.txt
          if-no-files-found: warn
