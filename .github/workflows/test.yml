name: Test Bot

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create output file
        run: |
          mkdir -p output
          echo "GitHub Actions works" > output/test.txt

      - name: Upload output
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: output/
